<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/base.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/login.css') }}">
  <link
    href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Irish+Grover&family=Montserrat:wght@400;500;700&display=swap"
    rel="stylesheet">
</head>
<body class="body-landing">

<header class="header">
  <a href="{{ url_for('index') }}" class="logo">
    <div class="logo-img">
      <img src="{{ url_for('static', filename='assets/images/logo-image.png') }}" alt="">
    </div>
    <div class="logo-name">Studio<span class="detail-logo">Alivio</span></div>
  </a>
  <div class="header-buttons">
    <a href="{{ url_for('signup') }}" class="btn-header signup">Sign Up</a>
  </div>
</header>

<div class="login-container">
  <h2 class="login-title">Login</h2>
  <form method="POST" action="{{ url_for('auth.login') }}">
    <div class="form-group">
      <label for="username">Username</label>
      <input type="text" id="username" name="username"
             class="input-field" placeholder="Enter your username" required>
    </div>
    <div class="form-group">
      <label for="password">Password</label>
      <input type="password" id="password" name="password"
             class="input-field" placeholder="Enter your password" required>
    </div>
    <button type="submit" class="btn-login">Login</button>
  </form>
  <div class="login-footer">
    <p>Don't have an account?
      <a href="{{ url_for('signup') }}">Create Account</a>
    </p>
  </div>
</div>

<footer class="footer">
  <div class="footer-links">
    <a href="#">Privacy Policy</a>
    <a href="#">Terms of Use</a>
    <a href="#">Support</a>
  </div>
  <p>© 2025 Studio Alivio</p>
</footer>

{% if error %}
<div id="errorModal" class="error-modal-overlay">
  <div class="error-modal-content">
    <h3>Ops! Algo deu errado.</h3>
    <p>{{ error }}</p>
    <button id="closeErrorModal" class="error-modal-close-btn">OK</button>
  </div>
</div>

<script>
  document.addEventListener('DOMContentLoaded', function() {
    const modal = document.getElementById('errorModal');
    const closeBtn = document.getElementById('closeErrorModal');
    modal.style.display = 'flex';
    closeBtn.onclick = function() {
      modal.style.display = 'none';
    }
    window.onclick = function(event) {
      if (event.target == modal) {
        modal.style.display = 'none';
      }
    }
  });
</script>
{% endif %}

</body>
</html>
