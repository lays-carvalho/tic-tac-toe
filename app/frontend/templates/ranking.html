<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Global Ranking</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/base.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/ranking.css') }}">
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Irish+Grover&family=Montserrat:wght@400;500;700&display=swap" rel="stylesheet">
</head>
<body class="body-ranking">
  <div id="app"></div>

  <section class="ranking-section">
    <h1>🏆 Global Ranking 🏆</h1>
    <table class="ranking-table">
      <thead>
        <tr>
          <th>#</th>
          <th>Jogador</th>
          <th>Vitórias</th>
          <th>Derrotas</th>
          <th>Empates</th>
        </tr>
      </thead>
      <tbody id="ranking-body">
        </tbody>
    </table>
    <a href="{{ url_for('auth.login') }}" class="join-challenge-btn">Entre no Desafio!</a>
  </section>

  <script type="module" src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
